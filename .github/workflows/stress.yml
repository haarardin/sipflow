name: Stress and Benchmarks
on:
  workflow_dispatch:
  push:
    branches: [feat/core-v0.1]
  schedule:
    - cron: "17 2 * * 1"
permissions:
  contents: read
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Stress tests
        run: go test -race -tags=stress -run '^TestStress' -count=1 -timeout=20m .
      - name: Benchmarks
        run: go test -run '^$' -bench . -benchmem -benchtime=3s ./... | tee benchmark.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark.txt
          retention-days: 30
