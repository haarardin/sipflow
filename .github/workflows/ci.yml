name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Tests with race detector
        run: go test -race -count=10 ./...
      - name: Parser fuzz smoke
        run: go test -run=^$ -fuzz=FuzzParse -fuzztime=10s .
      - name: SDP fuzz smoke
        run: go test -run=^$ -fuzz=FuzzParse -fuzztime=10s ./sdp
